<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>씨앗을 뿌리는 마음</title>
        <meta name="description" content="씨앗을 뿌리는 마음으로 살아가십시오. '무엇이든 될 수 있다'는 가능성을 손에 쥐고, 내가 목표로 하는 일을 적어보세요. 언젠가 어디선가 식물로 싹틔울 나의 목표를 'possibilityPlant' 웹페이지를 통해 미리 만나보세요.">
		<meta name="keywords" content="씨앗, 목표, 인터랙션, interaction">
        <link rel="stylesheet" href="middle.css">
    </head>
    <body>
        <h1 class = "a">
            '무엇이든 될 수 있다'는 가능성을 손에 쥐고, 내가 목표로 하는 일을 적어보세요. <br> 언젠가 어디선가 식물로 싹틔울 나의 목표를 미리 만나보세요.
        </h1>
        <h1 class = "b">입력값을 지우고, 나의 목표를 입력한 뒤 ENTER를 누르세요.</h1>

    <div id="help-btn">?</div>

    <div id="info-box" class="info-box">
        <p class="bold">조작방법</p>
        <p>입력값을 지우고 자신의 목표를 입력해보세요!</P>
        <p class="bold">MOUSE</p>
        <p>position x : wind motion</p>
        <p>position y : Plant Growing</p>
        <p class="bold">KEY</p>
        <p>1 : Opacity</p>
        <p>2 : line</p>
        <p>3 : Circle</p>
        <p>4 : Text</p>
        <p>5 : Text tracking</p>
        <p>6 : Flower</p>
        
    </div>

    <div id="resultText" class="result-text"></div>

    <textarea id="myInput" placeholder="목표를 입력해보세요..."></textarea>

    </body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
    <script src="./p5.svg.js"></script>
    <script src="./sketch.js"></script>
</html>
